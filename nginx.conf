# Cache control via a map so add_header appears only once in the server block.
# (nginx does NOT inherit add_header into a location that sets its own, which
# would silently drop all security headers there.)
map $uri $cache_control {
    default        "public, max-age=3600";
    "/"            "no-cache";
    "/index.html"  "no-cache";
}

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    charset      utf-8;

    server_tokens off;

    # Static site: reading is all there is.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    client_max_body_size  1k;
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          30s;
    keepalive_timeout     30s;

    # The page loads only its own files - no CDN, no fonts, no tracking - so the
    # CSP can be strict: no 'unsafe-inline', no 'unsafe-eval'. WebGL and canvas
    # need no extra sources.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), usb=(), payment=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $cache_control always;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        application/javascript text/css image/svg+xml;

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
